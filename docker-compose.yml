services:
  postgres:
    image: postgres:16-alpine
    container_name: acid_ledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acid_ledger
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_ledger_data:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acid_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_ledger_data:
